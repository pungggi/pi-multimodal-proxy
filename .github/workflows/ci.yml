name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify packed tarball
        run: |
          npm pack --dry-run 2>&1 | tee pack.log
          ! grep -E '\b(__tests__/|coverage/|\.github/)' pack.log
          grep -E 'extensions/vision-proxy\.ts' pack.log
